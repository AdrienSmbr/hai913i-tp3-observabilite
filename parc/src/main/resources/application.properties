spring.application.name=parc
server.port=8081

spring.main.banner-mode=off
logging.level.root=WARN

# --- TP3 : journalisation -------------------------------------------------
# Les cadriciels restent en WARN : leurs lignes INFO de démarrage ne répondent
# à aucune des trois questions. Seul le code applicatif descend à INFO.
logging.level.hai913i.tp3=INFO
# Les trois lignes de démarrage de Spring Boot (« Starting Application ... »)
# ne répondent à aucune question, et la première écrit le nom du compte
# système et le chemin de son dossier personnel : on les retire.
logging.level.hai913i.tp3.parc.Application=WARN

# Console, pour un humain : une ligne lisible, les champs typés (%kvp), puis
# trace_id et span_id. Ces deux identifiants ne sont PAS produits par
# l'application : l'agent OpenTelemetry les dépose dans le MDC de SLF4J.
# Sans agent, ils restent vides et le reste de la ligne est inchangé.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{0}] %msg %kvp {trace_id=%mdc{trace_id:-} span_id=%mdc{span_id:-}}%n

# Fichier, pour une machine : un objet JSON par ligne (format ECS), champs
# typés imbriqués, trace_id et span_id compris. C'est ce fichier que lisent
# relier-journal-trace.mjs et la sentinelle. Le dossier se change avec
# -Dvelos.journaux=<dossier>.
logging.file.name=${velos.journaux:journaux}/parc.log
logging.structured.format.file=ecs

# Base H2 en mémoire, recréée à chaque démarrage.
spring.datasource.url=jdbc:h2:mem:parc;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Durée de la consolidation de l'indice de rotation, en millisecondes.
parc.consolidation-ms=500