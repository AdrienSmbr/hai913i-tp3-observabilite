# TP3, OpenTelemetry Collector de velos-tp3.
#
# Recevoir, traiter, exporter. Trois sources (deux agents Java, un navigateur),
# deux backends : Jaeger pour les traces, Prometheus pour les métriques
# (bonus D3, D4). Rien ne parle à un backend sans passer par ici.

receivers:
  otlp:
    protocols:
      # Les deux services Java : l'agent exporte en OTLP/gRPC par défaut.
      grpc:
        endpoint: 0.0.0.0:4317
      # Le navigateur : OTLP/HTTP en JSON. Ce type de contenu n'est pas « sûr »
      # au sens CORS, donc une requête OPTIONS précède chaque envoi et le
      # Collector doit y répondre pour l'origine de l'interface.
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # Origine explicite, jamais « * ».
          allowed_origins:
            - http://localhost:4200
          max_age: 7200

processors:
  # Regrouper les spans en lots avant l'export.
  batch:
    timeout: 1s

  # Bonus D2 : minimiser la ressource avant qu'elle ne quitte le Collector.
  # L'agent Java décrit son processus par la ligne de commande complète et le
  # chemin de l'exécutable : des chemins absolus de la machine (le dossier
  # personnel, donc le nom du compte, quand on lance depuis son répertoire) et
  # tous les arguments de la JVM. Ces deux attributs sont recopiés sur CHAQUE
  # lot de spans et ne servent à aucune des trois questions : on les retire.
  # host.name est le nom de la machine (« macbook-pro-de-<prénom> » sur un
  # Mac) : on le remplace par son empreinte SHA-256, qui reste stable et
  # distingue encore deux machines sans les nommer. On garde ce qui identifie
  # l'exécution (service.name, service.instance.id, process.pid,
  # process.runtime.*, telemetry.distro.version).
  # Comparaison avant / après : observabilite/comparaison-d2/.
  resource/minimiser:
    attributes:
      - key: process.command_args
        action: delete
      - key: process.executable.path
        action: delete
      - key: host.name
        action: hash

  # Bonus D3 : seules nos métriques du métier (velos.*) passent. L'agent
  # exporte aussi les siennes (JVM, http.server.request.duration...) : elles
  # répondent à d'autres questions que les nôtres, et c'est ici, en un seul
  # endroit, qu'on décide de ce qui part vers le stockage des métriques.
  filter/metier:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^velos\\.")'

exporters:
  # Vers Jaeger, en OTLP natif. « otlp_grpc » est le nom actuel du type.
  # « otlp » seul est un alias déprécié.
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Diagnostic : un résumé de ce qui entre, visible avec
  # `docker compose -f observabilite/docker-compose.yml logs -f collector`.
  debug:
    verbosity: basic

  # Bonus D4 : les métriques exposées au format Prometheus, sur le port 8889
  # du conteneur, où Prometheus vient les chercher (modèle « pull »). Le
  # Collector ne pousse rien vers Prometheus : il sert une page de métriques.
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/minimiser, batch]
      exporters: [otlp_grpc/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [resource/minimiser, filter/metier, batch]
      exporters: [prometheus, debug]
  telemetry:
    logs:
      level: info
